repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3  # NOTE: Keep in sync with `lint` dependency-group (ruff)
    hooks:
    -   id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
    -   id: ruff-format

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2  # NOTE: Keep in sync with `lint` dependency-group (mypy)
    hooks:
    -   id: mypy
        additional_dependencies: [types-setuptools, types-PyYAML, pydantic, httpx, eth-typing]

-   repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
    -   id: mdformat
        additional_dependencies: [mdformat-gfm, mdformat-frontmatter, mdformat-pyproject]

default_language_version:
    python: python3
